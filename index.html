<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Bus Tracker</title>
        <link rel="stylesheet" href="style.css">
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxwqvNQqT0QTuE2iQNwN1hPLrFet9eO9iZf0Z8q0A="
            crossorigin=""
        />
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">🚌 HK Bus Tracker</h1>
                <p class="subtitle">Real-time KMB & LWB Bus Information</p>
            </div>
        </header>

        <main class="main-content">
            <div class="search-section">
                <label for="busRouteSelect" class="search-label">Find Your Bus Route</label>
                <div class="search-container">
                    <input 
                        type="text" 
                        id="busRouteSearch" 
                        class="search-input" 
                        placeholder="Search route number (e.g., 1, 10, 100)..."
                    >
                    <select id="busRouteSelect" class="bus-select">
                        <option value="">Select a route...</option>
                    </select>
                </div>
            </div>

            <div class="content-wrapper single">
                <div class="info-panel">
                    <div class="info-card">
                        <div class="info-header">Route Information</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Route Number</span>
                                <span class="info-value" id="busNumber">--</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Origin</span>
                                <span class="info-value long" id="origin">--</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Destination</span>
                                <span class="info-value long" id="destination">--</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Service Type</span>
                                <span class="info-value" id="serviceType">--</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Last Updated</span>
                                <span class="info-value" id="time">--</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="map-panel">
                    <div class="info-card">
                        <div class="info-header">Route Map</div>
                        <div id="map" class="map"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script src="script.js"></script>
</body>
</html>
